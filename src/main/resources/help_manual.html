<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0c9aa6;
            text-align: center;
        }
        .logo {
            display: block;
            margin: 20px auto;
            max-width: 200px;
        }
        h2 {
            border-bottom: 2px solid #0c9aa6;
            padding-bottom: 5px;
            color: #139bb9;
        }
        p {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/app/app_logo.png" class="logo" alt="App Logo">
        <h1>Sports Manager Help Manual</h1>
        
        <h2>Introduction</h2>
        <p>Welcome to the <strong>Sports Manager</strong> application.</p>
        
        <p style="text-align:center; color: #888; font-size: 0.9em; margin-top: 40px;">&copy; 2026 Sports Manager</p>
    </div>
</body>
</html>
